spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: users
          uri: ${USER_SERVICE_URL:http://localhost:8082}
          predicates: [ "Path=/api/auth/**" ]
          filters: [ "StripPrefix=1" ]
        - id: products
          uri: ${PRODUCT_SERVICE_URL:http://localhost:8083}
          predicates: [ "Path=/api/products/**,/api/products" ]
          filters: [ "StripPrefix=1" ]
        - id: orders
          uri: ${ORDER_SERVICE_URL:http://localhost:8084}
          predicates: [ "Path=/api/orders/**,/api/orders" ]
          filters: [ "StripPrefix=1" ]
        - id: inventory
          uri: ${INVENTORY_SERVICE_URL:http://localhost:8085}
          predicates: [ "Path=/api/inventory/**,/api/inventory" ]
          filters: [ "StripPrefix=1" ]
        - id: notifications
          uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8086}
          predicates: [ "Path=/api/notifications/**,/api/notifications" ]
          filters: [ "StripPrefix=1" ]
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:change-me-change-me-change-me-change-me}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: api-gateway
logging:
  structured:
    format:
      console: ecs
