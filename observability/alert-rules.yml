groups:
  - name: shoplite-availability
    rules:
      - alert: ServiceDown
        expr: up{job="shoplite-services"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }} is down"
          description: "Prometheus cannot scrape {{ $labels.service }} for 1 minute."

      - alert: HighErrorRate
        expr: |
          sum by (service) (rate(http_server_requests_seconds_count{status=~"5.."}[5m]))
            / sum by (service) (rate(http_server_requests_seconds_count[5m])) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.service }}: more than 5% of requests fail"

      - alert: SlowRequestsP95
        expr: |
          histogram_quantile(0.95, sum by (le, service)
            (rate(http_server_requests_seconds_bucket[5m]))) > 1
        for: 3m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} p95 latency above 1s"

  - name: shoplite-business
    rules:
      - alert: LoginFailureSpike
        expr: rate(auth_login_failures_total[5m]) > 0.5
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "Many failed logins. Possible password guessing."

      - alert: InventoryRejectingOrders
        expr: increase(inventory_rejected_total[10m]) > 5
        for: 0m
        labels: { severity: warning }
        annotations:
          summary: "Inventory rejected more than 5 orders in 10 minutes (out of stock?)"

      - alert: KafkaConsumerLag
        expr: max by (service) (kafka_consumer_fetch_manager_records_lag_max) > 100
        for: 2m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.service }} is falling behind on Kafka messages"

  - name: shoplite-hosts
    rules:
      - alert: HighCpu
        expr: 100 - (avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} CPU above 85%"

      - alert: LowMemory
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) * 100 < 10
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "{{ $labels.host }} has less than 10% memory free"

      - alert: DiskAlmostFull
        expr: (node_filesystem_avail_bytes{mountpoint="/",fstype!="rootfs"} / node_filesystem_size_bytes{mountpoint="/",fstype!="rootfs"}) * 100 < 15
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.host }} disk is over 85% full"
