# Jenkins server. Run:  docker compose up -d
# The host Docker socket is mounted so pipelines can build images (fine for practice; avoid on shared prod Jenkins).
name: jenkins
services:
  jenkins:
    build: .
    restart: unless-stopped
    user: root
    ports: ["8080:8080", "50000:50000"]
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home:
